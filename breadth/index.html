  <div id="bootError" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#b91c1c;color:#fff;padding:10px 16px;font:13px/1.6 'Noto Sans SC',sans-serif;white-space:pre-wrap;">
    <strong>广度数据加载失败：</strong><span id="bootErrorMsg"></span>
    <button id="bootReloadBtn" type="button" style="margin-left:12px;background:#fff;color:#b91c1c;border:none;border-radius:4px;padding:2px 10px;font:12px/1.6 sans-serif;cursor:pointer;">重新加载</button>
  </div>
  <script>
    (function(){
      function show(msg){
        try{
          var b=document.getElementById('bootError'),t=document.getElementById('bootErrorMsg');
          if(b&&t){t.textContent=String(msg).slice(0,600);b.style.display='block';}
        }catch(_e){}
        try{console.error('[breadth-boot]',msg);}catch(_e){}
      }
      window.__showBootError=show;
      window.__hideBootError=function(){ try{var b=document.getElementById('bootError'); if(b) b.style.display='none';}catch(_e){} };
      try{var rb=document.getElementById('bootReloadBtn'); if(rb) rb.addEventListener('click', function(){ location.reload(); });}catch(_e){}
      window.__BREADTH_BUILD__='20260927c';
      try{
        var bd=document.createElement('div');
        bd.style.cssText='position:fixed;left:8px;bottom:6px;z-index:9998;font:10px/1.4 Consolas,monospace;color:#94a3b8;background:rgba(255,255,255,.75);padding:2px 6px;border-radius:4px;pointer-events:none;';
        bd.textContent='广度追踪 build '+window.__BREADTH_BUILD__;
        document.body.appendChild(bd);
      }catch(_e){}
      setInterval(function(){
        try{
          fetch('version.txt',{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(txt){
            var cur=(txt||'').trim();
            if(cur && cur!==window.__BREADTH_BUILD__){
              var b=document.getElementById('bootError'),s=b?b.querySelector('strong'):null,t=document.getElementById('bootErrorMsg');
              if(b&&s&&t){s.textContent='版本提示：';t.textContent='系统已发布新版本，当前页面仍是旧版本，部分内容可能缺失。请关闭本页所有旧标签页并按 Ctrl+F5 强制刷新。';b.style.display='block';}
            }
          }).catch(function(){});
        }catch(_e){}
      },60000);
      window.addEventListener('error',function(e){
        if(e&&e.target&&(e.target.tagName==='SCRIPT'||e.target.tagName==='LINK')){
          show('资源加载失败：'+(e.target.src||e.target.href||'(未知)'));
        }else{
          show((e&&e.message?e.message:'脚本错误')+(e&&e.filename?(' @ '+e.filename+':'+e.lineno):''));
        }
      },true);
      window.addEventListener('unhandledrejection',function(e){
        var r=e&&e.reason;
        show('异步加载失败：'+(r&&r.message?r.message:String(r)));
      });
    })();
  </script>

  <!-- Lite data: loaded asynchronously to avoid blocking render -->
  <script>
    window.__LITE_PARTS__ = [];
    window.__LITE_LOADED__ = false;
    async function loadLiteData() {
      const manifest = window.__MANIFEST__ || {};
      const expectedParts = Number(manifest.meta?.total_shards);
      const expectedRecords = Number(manifest.meta?.records_total);
      const dataVersion = String(manifest.meta?.data_version || '');
      if (!Number.isInteger(expectedParts) || expectedParts <= 0) {
        throw new Error('manifest missing valid total_shards');
      }
      const hint = document.querySelector('.loading-hint');
      let done = 0;
      const BATCH = Math.min(10, expectedParts);
      // 单个分片自动重试：瞬时网络/代理故障自愈，避免一颗分片失败就让全页降级。
      async function fetchRetry(url, attempts) {
        let lastErr = null;
        for (let a = 1; a <= attempts; a++) {
          try {
            const r = await fetch(url);
            if (r.ok) return r;
            lastErr = new Error(`HTTP ${r.status} @ ${url}`);
            if (r.status === 404) return r; // 404 交给调用方语义处理（如 meta 首片降级）
          } catch (e) { lastErr = e; }
          if (a < attempts) await new Promise(res => setTimeout(res, 400 * a));
        }
        throw lastErr || new Error('fetch failed: ' + url);
      }
      window.__BODY_SHARDS__ = {};  // shard index → loaded data (for on-demand body)

      // ── Tier 1: Ultra-minimal meta shards (3.9MB gzip) → instant render ──
      const metaParts = new Array(expectedParts);
      let useMetaShards = true;

      async function fetchMetaShard(j) {
        const response = await fetchRetry(`data/processed/meta-part-${j}.js?v=${encodeURIComponent(dataVersion)}`, 3);
        if (!response.ok) {
          if (j === 0 && response.status === 404) { useMetaShards = false; return; }
          throw new Error(`meta-part-${j}.js HTTP ${response.status}`);
        }
        const text = await response.text();
        const marker = 'window.__META_PARTS__.push(';
        const start = text.indexOf(marker);
        const end2 = text.lastIndexOf(');');
        if (start < 0 || end2 <= start) throw new Error(`invalid meta-part-${j}.js wrapper`);
        const payload = text.slice(start + marker.length, end2);
        metaParts[j] = JSON.parse(payload);
        done++;
        if (hint) hint.textContent = `正在载入情报数据… ${Math.round(done / expectedParts * 100)}%`;
      }

      try {
        for (let s = 0; s < expectedParts; s += BATCH) {
          const end = Math.min(s + BATCH, expectedParts);
          await Promise.all(Array.from({ length: end - s }, (_, k) => fetchMetaShard(s + k)));
          if (!useMetaShards) break;
        }
      } catch(e) { useMetaShards = false; }

      // Fallback: load full lite-part shards if meta-part unavailable
      if (!useMetaShards) {
        window.__LITE_PARTS__ = new Array(expectedParts);
        done = 0;
        for (let s = 0; s < expectedParts; s += BATCH) {
          const end = Math.min(s + BATCH, expectedParts);
          await Promise.all(Array.from({ length: end - s }, async (_, k) => {
            const j = s + k;
            const response = await fetchRetry(`data/processed/lite-part-${j}.js?v=${encodeURIComponent(dataVersion)}`, 3);
            if (!response.ok) throw new Error(`lite-part-${j}.js HTTP ${response.status}`);
            const text = await response.text();
            const marker = 'window.__LITE_PARTS__.push(';
            const start = text.indexOf(marker);
            const end2 = text.lastIndexOf(');');
            if (start < 0 || end2 <= start) throw new Error(`invalid lite-part-${j}.js wrapper`);
            const payload = text.slice(start + marker.length, end2);
            window.__LITE_PARTS__[j] = JSON.parse(payload);
            done++;
            if (hint) hint.textContent = `正在载入情报数据… ${Math.round(done / expectedParts * 100)}%`;
          }));
        }
        const data = window.__LITE_PARTS__.flat();
        if (Number.isInteger(expectedRecords) && data.length !== expectedRecords) {
          throw new Error(`record count mismatch: ${data.length} != ${expectedRecords}`);
        }
        window.__LITE_DATA__ = data;
        window.__LITE_LOADED__ = true;
        window.__SUMMARY_LOADED__ = true;
        window.__BODY_LOADED__ = true;
        document.dispatchEvent(new Event('lite-ready'));
        document.dispatchEvent(new Event('summary-ready'));
        return;
      }

      const data = metaParts.flat();
      if (Number.isInteger(expectedRecords) && data.length !== expectedRecords) {
        throw new Error(`record count mismatch: ${data.length} != ${expectedRecords}`);
      }
      window.__LITE_DATA__ = data;
      window.__LITE_LOADED__ = true;
      window.__SUMMARY_LOADED__ = false;
      window.__BODY_LOADED__ = false;
      document.dispatchEvent(new Event('lite-ready'));

      // ── Tier 2: Background-load summary shards (AI摘要 + 评分维度, 8.5MB gzip) ──
      (async () => {
        let sd = 0;
        async function fetchSummaryShard(j) {
          const response = await fetch(`data/processed/summary-part-${j}.js?v=${encodeURIComponent(dataVersion)}`);
          if (!response.ok) return;
          const text = await response.text();
          const marker = 'window.__SUMMARY_PARTS__.push(';
          const start = text.indexOf(marker);
          const end2 = text.lastIndexOf(');');
          if (start < 0 || end2 <= start) return;
          const payload = text.slice(start + marker.length, end2);
          const items = JSON.parse(payload);
          // Store in a map for the app to pick up
          window.__SUMMARY_PARTS__ = window.__SUMMARY_PARTS__ || [];
          window.__SUMMARY_PARTS__[j] = items;
          sd++;
        }
        for (let s = 0; s < expectedParts; s += BATCH) {
          const end = Math.min(s + BATCH, expectedParts);
          await Promise.all(Array.from({ length: end - s }, (_, k) => fetchSummaryShard(s + k)));
        }
        window.__SUMMARY_LOADED__ = true;
        document.dispatchEvent(new Event('summary-ready'));
      })();

      // ── Tier 3: Body text loaded on-demand per shard when user clicks [展开全文] ──
      // Implemented in app.js expand handler via fetchBodyShard()
    }
  </script>
