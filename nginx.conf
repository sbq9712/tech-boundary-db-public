server {
    listen 80;
    server_name _;

    # 上传不设大小上限：0 = 关闭 nginx 请求体限制（后端同样不限）。
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # SSE 长流（仅问答流端点收窄到此处，Codex P3）：api 侧已有 15s
    # ": ping" 心跳重置读时钟；这里再放宽到 30 分钟兜底（默认 60s/此前
    # 300s 会在答案侧核验链静默期掐断长回答，前端表现为提问后 network
    # error——2026-10-03 web error log 实证）。普通 /api/ 仍用 300s，
    # 避免心跳把真实卡死的普通请求无差别续命。
    location ~ ^/api/(assistant/stream|breadth/qa/chat/stream)$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        # SSE support: disable buffering, keep connection alive
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        # 普通接口维持 300s（历史值）；SSE 专属放宽见上。
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 即使未来镜像内容误扩张，也不允许暴露配置、源码或运行时目录。
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~ ^/(backend|scripts|docs|external-data|runtime-data|backup)(/|$) {
        return 404;
    }

    # 上传文件目录：禁止静态访问，只允许通过 /api/uploads/{id}/download 鉴权下载
    location = /uploads {
        return 403;
    }

    location ^~ /uploads/ {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
