server {
    listen 80;
    server_name _;

    # 后端限制为单文件 50MB、单批 200MB；这里为 multipart 留少量余量。
    client_max_body_size 210m;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # SSE support: disable buffering, keep connection alive
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # 即使未来镜像内容误扩张，也不允许暴露配置、源码或运行时目录。
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~ ^/(backend|scripts|docs|external-data|runtime-data|backup)(/|$) {
        return 404;
    }

    # 上传文件目录：禁止静态访问，只允许通过 /api/uploads/{id}/download 鉴权下载
    location = /uploads {
        return 403;
    }

    location ^~ /uploads/ {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
