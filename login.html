<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <title>登录 — 技术边界数据库</title>
  <style>
    :root{
      --bg-canvas:#f7f8f8;--bg-panel:#ffffff;--bg-surface:#f0f1f2;
      --text-primary:#1a1a1a;--text-secondary:#3d3d3d;--text-tertiary:#6b6f76;--text-quaternary:#9aa0a6;
      --border-subtle:rgba(0,0,0,.06);--border-standard:rgba(0,0,0,.1);
      --brand:#5e6ad2;--brand-light:#7170ff;--brand-bg:rgba(94,106,210,.08);--brand-border:rgba(94,106,210,.25);
      --radius-md:8px;--radius-lg:12px;--radius-xl:16px;
      --sans:'Outfit','Noto Sans SC',system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
      --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:var(--sans);color:var(--text-primary);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:
        radial-gradient(1200px 500px at 70% -10%,rgba(94,106,210,.06),transparent 60%),
        var(--bg-canvas);
    }
    .card{
      width:100%;max-width:380px;
      background:var(--bg-panel);
      border:1px solid var(--border-subtle);
      border-radius:var(--radius-xl);
      padding:38px 34px 32px;
      box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 40px rgba(16,24,40,.06);
      position:relative;overflow:hidden;
    }
    .card::before{
      content:"";position:absolute;left:0;top:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--brand-light),var(--brand));
    }
    .brand-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
    .brand-mark{
      display:flex;align-items:center;justify-content:center;
      width:34px;height:34px;border-radius:var(--radius-md);
      background:var(--brand);color:#fff;flex-shrink:0;
    }
    .brand-mark svg{width:19px;height:19px}
    .brand{font-size:16px;font-weight:700;letter-spacing:-.01em}
    .subtitle{
      text-align:center;color:var(--text-quaternary);font-size:11px;
      font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;
      margin-bottom:30px;
    }
    label{display:block;font-size:12px;color:var(--text-tertiary);font-weight:600;margin-bottom:6px}
    .field{margin-bottom:16px}
    input{
      width:100%;background:var(--bg-canvas);
      border:1px solid var(--border-standard);color:var(--text-primary);
      padding:11px 13px;border-radius:var(--radius-md);
      font-size:14px;font-family:inherit;outline:none;
      transition:border-color .15s,box-shadow .15s;
    }
    input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
    input::placeholder{color:var(--text-quaternary)}
    .btn{
      width:100%;padding:12px;border-radius:var(--radius-md);border:none;
      background:var(--brand);color:#fff;font-size:14px;font-weight:600;
      font-family:inherit;cursor:pointer;margin-top:10px;
      transition:background .15s,box-shadow .15s;
    }
    .btn:hover{background:var(--brand-light);box-shadow:0 2px 10px rgba(94,106,210,.3)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .error{color:#b42318;font-size:12px;text-align:center;min-height:18px;margin-top:12px}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-row">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
      <div class="brand">技术边界数据库</div>
    </div>
    <div class="subtitle">Tech Boundary DB</div>

    <div class="field">
      <label for="username">用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
    </div>

    <button class="btn" id="btnLogin">登录</button>
    <div class="error" id="errorMsg"></div>
  </div>

<script>
  const API_BASE = window.API_BASE || "/api";

  // 已登录则直接跳回目标页
  const stored = localStorage.getItem("auth_token");
  if (stored) {
    const params = new URLSearchParams(location.search);
    location.replace(params.get("next") || "/index.html");
  }

  const btnLogin = document.getElementById("btnLogin");
  const errorMsg = document.getElementById("errorMsg");

  async function doLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    if (!username || !password) {
      errorMsg.textContent = "请填写用户名和密码";
      return;
    }
    btnLogin.disabled = true;
    errorMsg.textContent = "";
    try {
      const r = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        errorMsg.textContent = data.detail || "用户名或密码错误";
        return;
      }
      const data = await r.json();
      localStorage.setItem("auth_token", data.access_token);
      const params = new URLSearchParams(location.search);
      location.replace(params.get("next") || "/index.html");
    } catch (e) {
      errorMsg.textContent = "网络错误，请稍后重试";
    } finally {
      btnLogin.disabled = false;
    }
  }

  btnLogin.addEventListener("click", doLogin);
  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") doLogin();
  });
</script>
</body>
</html>
