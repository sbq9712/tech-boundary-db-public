<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>登录 — 技术边界数据库</title>
  <style>
    :root{
      --bg-canvas:#f6f7f9;--bg-panel:#ffffff;--bg-surface:#f0f1f2;
      --text-primary:#17181c;--text-secondary:#3d3d3d;--text-tertiary:#6b6f76;--text-quaternary:#9aa0a6;
      --border-subtle:rgba(23,24,28,.06);--border-standard:rgba(23,24,28,.1);
      --brand:#5e6ad2;--brand-light:#7170ff;--brand-bg:rgba(94,106,210,.08);--brand-border:rgba(94,106,210,.25);
      --radius-md:10px;--radius-lg:14px;--radius-xl:22px;
      --sans:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',sans-serif;
      --mono:ui-monospace,'Cascadia Code','SF Mono',Consolas,Menlo,monospace;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:var(--sans);color:var(--text-primary);
      display:grid;place-items:center;overflow:hidden;
      background:var(--bg-canvas);
    }
    /* 签名背景：错位的两圈"边界框" + 双侧品牌微光 */
    .scene{position:fixed;inset:0;pointer-events:none;overflow:hidden}
    .scene::before,.scene::after{
      content:"";position:absolute;border-radius:32px;
      border:1.5px solid rgba(94,106,210,.13);
    }
    .scene::before{width:min(52vw,560px);height:min(52vw,560px);left:calc(50% - min(26vw,280px) - 300px);top:calc(50% - min(26vw,280px) - 60px)}
    .scene::after{width:min(52vw,560px);height:min(52vw,560px);left:calc(50% - min(26vw,280px) + 244px);top:calc(50% - min(26vw,280px) + 108px);border-color:rgba(94,106,210,.08)}
    .glow{position:absolute;border-radius:50%;filter:blur(90px)}
    .glow.a{width:420px;height:420px;left:-120px;top:-140px;background:rgba(94,106,210,.13)}
    .glow.b{width:380px;height:380px;right:-110px;bottom:-150px;background:rgba(113,112,255,.10)}
    /* 面板 */
    .panel{
      position:relative;z-index:1;
      width:100%;max-width:408px;margin:20px;
      background:var(--bg-panel);
      border-radius:var(--radius-xl);
      padding:44px 44px 36px;
      box-shadow:0 1px 2px rgba(23,24,28,.05),0 8px 20px rgba(23,24,28,.05),0 28px 64px rgba(94,106,210,.10);
      animation:rise .5s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .logo-tile{
      width:46px;height:46px;border-radius:13px;
      display:grid;place-items:center;color:#fff;
      background:linear-gradient(135deg,var(--brand-light),var(--brand));
      box-shadow:0 6px 16px rgba(94,106,210,.35);
      margin-bottom:20px;
    }
    .logo-tile svg{width:24px;height:24px}
    h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.01em}
    .lead{margin:6px 0 30px;color:var(--text-tertiary);font-size:13px}
    label{display:block;font-size:12px;color:var(--text-tertiary);font-weight:600;margin-bottom:6px}
    .field{margin-bottom:16px}
    input{
      width:100%;height:44px;background:var(--bg-canvas);
      border:1px solid var(--border-standard);color:var(--text-primary);
      padding:0 13px;border-radius:var(--radius-md);
      font-size:14px;font-family:inherit;outline:none;
      transition:border-color .15s,box-shadow .15s,background .15s;
    }
    input:hover{border-color:rgba(23,24,28,.18)}
    input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-bg)}
    input::placeholder{color:var(--text-quaternary)}
    .btn{
      width:100%;height:44px;margin-top:8px;border:none;border-radius:var(--radius-md);
      background:var(--brand);color:#fff;font-size:14px;font-weight:600;font-family:inherit;
      cursor:pointer;transition:background .15s,box-shadow .2s,transform .15s;
    }
    .btn:hover{background:var(--brand-light);box-shadow:0 4px 14px rgba(94,106,210,.35);transform:translateY(-1px)}
    .btn:active{transform:none}
    .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .error{color:#b42318;font-size:12px;text-align:center;min-height:18px;margin-top:14px}
    .foot{
      margin-top:26px;padding-top:18px;border-top:1px solid var(--border-subtle);
      display:flex;justify-content:space-between;align-items:center;
      color:var(--text-quaternary);font-size:11px;
    }
    .foot .code{font-family:var(--mono);letter-spacing:.08em}
    @media(max-width:480px){
      .panel{padding:34px 26px 28px;margin:12px}
      .scene::before,.scene::after{display:none}
    }
    @media(prefers-reduced-motion:reduce){
      .panel{animation:none}
      .btn,input{transition:none}
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"><div class="glow a"></div><div class="glow b"></div></div>
  <main class="panel">
    <div class="logo-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    <h1>技术边界数据库</h1>
    <p class="lead">登录以继续</p>

    <div class="field">
      <label for="username">用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
    </div>

    <button class="btn" id="btnLogin">登录</button>
    <div class="error" id="errorMsg"></div>
    <div class="foot"><span>内部系统</span><span class="code">TECH BOUNDARY DB</span></div>
  </main>

<script>
  const API_BASE = window.API_BASE || "/api";

  // 已登录则直接跳回目标页
  const stored = localStorage.getItem("auth_token");
  if (stored) {
    const params = new URLSearchParams(location.search);
    location.replace(params.get("next") || "/index.html");
  }

  const btnLogin = document.getElementById("btnLogin");
  const errorMsg = document.getElementById("errorMsg");

  async function doLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    if (!username || !password) {
      errorMsg.textContent = "请填写用户名和密码";
      return;
    }
    btnLogin.disabled = true;
    errorMsg.textContent = "";
    try {
      const r = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        errorMsg.textContent = data.detail || "用户名或密码错误";
        return;
      }
      const data = await r.json();
      localStorage.setItem("auth_token", data.access_token);
      const params = new URLSearchParams(location.search);
      location.replace(params.get("next") || "/index.html");
    } catch (e) {
      errorMsg.textContent = "网络错误，请稍后重试";
    } finally {
      btnLogin.disabled = false;
    }
  }

  btnLogin.addEventListener("click", doLogin);
  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") doLogin();
  });
</script>
</body>
</html>
