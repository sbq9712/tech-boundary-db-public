services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tech_intel
      POSTGRES_USER: tech
      POSTGRES_PASSWORD: tech
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tech -d tech_intel"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://tech:tech@db:5432/tech_intel
      DATA_DIR: /app/data
      HERMES_AGENT_MODE: ${HERMES_AGENT_MODE:-http}
      HERMES_AGENT_HTTP_URL: ${HERMES_AGENT_HTTP_URL:-http://readonly-agent:8765/query}
      HERMES_AGENT_CLI: ${HERMES_AGENT_CLI:-hermes}
      HERMES_AGENT_TIMEOUT_SECONDS: ${HERMES_AGENT_TIMEOUT_SECONDS:-120}
      HERMES_AGENT_TOOLSETS: ${HERMES_AGENT_TOOLSETS:-}
      TECHDB_AGENT_API_KEY: ${TECHDB_AGENT_API_KEY:-}
      TECHDB_AGENT_BASE_URL: ${TECHDB_AGENT_BASE_URL:-https://api.xiaowang886.xyz/v1}
      TECHDB_AGENT_MODEL: ${TECHDB_AGENT_MODEL:-claude-opus-4-8}
      TECHDB_KB_PATH: /knowledge-base
    volumes:
      - ./data_sources:/app/data_sources:ro
      - ./backend/scripts:/app/scripts:ro
      - /mnt/d/##EDMUNDS/知识库:/knowledge-base:ro
      - /mnt/d/##EDMUNDS/技术数据库/delivery_views:/app/delivery_views:ro
    depends_on:
      db:
        condition: service_healthy
      readonly-agent:
        condition: service_started
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  readonly-agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.readonly_agent:app --host 0.0.0.0 --port 8765
    environment:
      DATABASE_URL: postgresql+psycopg2://tech:tech@db:5432/tech_intel
      DATA_DIR: /app/data
      TECHDB_KB_PATH: /knowledge-base
      TECHDB_CHATBOT_PACKAGE_PATH: /chatbot-integration-package
      TECHDB_AGENT_API_KEY: ${TECHDB_AGENT_API_KEY:-}
      TECHDB_AGENT_BASE_URL: ${TECHDB_AGENT_BASE_URL:-https://api.openai.com/v1}
      TECHDB_AGENT_MODEL: ${TECHDB_AGENT_MODEL:-gpt-5.5}
      TECHDB_AGENT_AI_TIMEOUT_SECONDS: ${TECHDB_AGENT_AI_TIMEOUT_SECONDS:-90}
    volumes:
      - /mnt/d/##EDMUNDS/知识库:/knowledge-base:ro
      - /mnt/d/##EDMUNDS/技术数据库/chatbot_integration_package:/chatbot-integration-package:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8765:8765"

volumes:
  pg_data:
