networks:
  technet:
    driver: bridge
    # WSL host eth0 MTU is 1410, but Docker default bridge is 1500.
    # Oversized TLS ClientHello packets get silently dropped at the WSL NAT,
    # causing SSL UNEXPECTED_EOF errors to external AI APIs.
    # Match the network MTU to the host to fix this.
    driver_opts:
      com.docker.network.driver.mtu: ${TECHDB_DOCKER_MTU:-1410}

services:
  db:
    image: postgres:16
    networks:
      - technet
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tech_intel}
      POSTGRES_USER: ${POSTGRES_USER:-techdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  canonical-qa:
    image: techdb-canonical-qa:${TECHDB_IMAGE_TAG:-0801}
    networks:
      - technet
    environment:
      TECHDB_QA_INDEX_TOKEN: ${TECHDB_QA_INDEX_TOKEN:-}
      TECHDB_QA_INCREMENTAL_INDEX_PATH: /app/data/lightrag/incremental/index.pkl
    volumes:
      - qa_incremental_data:/app/data/lightrag/incremental
    ports:
      - "${TECHDB_QA_BIND:-127.0.0.1}:${TECHDB_QA_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=4)); assert d['vector_index_ready'] and d['bm25_ready'] and d['index_mapping_ready']"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  api:
    image: techdb-api:${TECHDB_IMAGE_TAG:-0801}
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - technet
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-techdb}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-tech_intel}
      TECHDB_ENV: ${TECHDB_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      TECHDB_INITIAL_ADMIN_USERNAME: ${TECHDB_INITIAL_ADMIN_USERNAME:-admin}
      TECHDB_INITIAL_ADMIN_PASSWORD: ${TECHDB_INITIAL_ADMIN_PASSWORD:?TECHDB_INITIAL_ADMIN_PASSWORD must be set in .env}
      DATA_DIR: /app/data
      HERMES_AGENT_MODE: ${HERMES_AGENT_MODE:-http}
      HERMES_AGENT_HTTP_URL: ${HERMES_AGENT_HTTP_URL:-http://readonly-agent:8765/query}
      HERMES_AGENT_CLI: ${HERMES_AGENT_CLI:-hermes}
      HERMES_AGENT_TIMEOUT_SECONDS: ${HERMES_AGENT_TIMEOUT_SECONDS:-120}
      HERMES_AGENT_TOOLSETS: ${HERMES_AGENT_TOOLSETS:-}
      TECHDB_AGENT_API_KEY: ${TECHDB_AGENT_API_KEY}
      TECHDB_AGENT_BASE_URL: ${TECHDB_AGENT_BASE_URL:-https://aigate.catl.com/v1}
      TECHDB_AGENT_MODEL: ${TECHDB_AGENT_MODEL:-GLM-5.2}
      TECHDB_AGENT_ALLOWED_MODELS: ${TECHDB_AGENT_ALLOWED_MODELS:-}
      TECHDB_AGENT_AI_TIMEOUT_SECONDS: ${TECHDB_AGENT_AI_TIMEOUT_SECONDS:-180}
      TECHDB_AGENT_MAX_RETRIES: ${TECHDB_AGENT_MAX_RETRIES:-2}
      TECHDB_AGENT_RETRY_BASE_DELAY_SECONDS: ${TECHDB_AGENT_RETRY_BASE_DELAY_SECONDS:-2}
      TECHDB_AGENT_HISTORY_MAX_MESSAGES: ${TECHDB_AGENT_HISTORY_MAX_MESSAGES:-60}
      TECHDB_AGENT_HISTORY_MAX_CHARS: ${TECHDB_AGENT_HISTORY_MAX_CHARS:-60000}
      TECHDB_AGENT_RETRIEVAL_MAX_CHARS: ${TECHDB_AGENT_RETRIEVAL_MAX_CHARS:-30000}
      TECHDB_AGENT_MAX_OUTPUT_TOKENS: ${TECHDB_AGENT_MAX_OUTPUT_TOKENS:-10000}
      TECHDB_QA_SERVICE_URL: ${TECHDB_QA_SERVICE_URL:-http://canonical-qa:8765}
      TECHDB_QA_SERVICE_TIMEOUT_SECONDS: ${TECHDB_QA_SERVICE_TIMEOUT_SECONDS:-120}
      TECHDB_QA_INDEX_TIMEOUT_SECONDS: ${TECHDB_QA_INDEX_TIMEOUT_SECONDS:-300}
      TECHDB_QA_INDEX_TOKEN: ${TECHDB_QA_INDEX_TOKEN:-}
      TECHDB_KB_PATH: /knowledge-base
      BREADTH_DATA_PATH: /app/breadth_data
      TECHDB_UPLOAD_DIR: /app/uploads
      HF_HOME: /app/document-models/huggingface
      TECHDB_DOCLING_ARTIFACTS_PATH: ${TECHDB_DOCLING_ARTIFACTS_PATH:-/app/document-models/docling}
      TECHDB_DOCLING_BACKEND_OPTIONS_FILE: ${TECHDB_DOCLING_BACKEND_OPTIONS_FILE:-}
      TECHDB_DOCLING_FORMULAS: ${TECHDB_DOCLING_FORMULAS:-true}
      TECHDB_DOCUMENT_TOKENIZER: ${TECHDB_DOCUMENT_TOKENIZER:-/app/document-models/docling/bge-m3-tokenizer}
      TECHDB_DOCUMENT_TOKENIZER_SOURCE: ${TECHDB_DOCUMENT_TOKENIZER_SOURCE:-BAAI/bge-m3}
      TECHDB_DOCUMENT_CHUNK_TOKENS: ${TECHDB_DOCUMENT_CHUNK_TOKENS:-512}
      TECHDB_UPLOAD_RECOVERY_ENABLED: ${TECHDB_UPLOAD_RECOVERY_ENABLED:-true}
    volumes:
      - ./backend/scripts:/app/scripts:ro
      - ${TECHDB_KB_PATH:-./external-data/knowledge-base}:/knowledge-base:ro
      - ${TECHDB_CHATBOT_PACKAGE_PATH:-./external-data/chatbot-package}:/chatbot-integration-package:ro
      - ${TECHDB_DELIVERY_VIEWS_PATH:-./external-data/delivery-views}:/app/delivery_views:ro
      - ./breadth/data:/app/breadth_data:ro
      - ${TECHDB_UPLOAD_HOST_PATH:-./uploads}:/app/uploads
      - ${TECHDB_DOCUMENT_MODELS_PATH:-./external-data/document-models}:/app/document-models
    depends_on:
      db:
        condition: service_healthy
      canonical-qa:
        condition: service_healthy
      readonly-agent:
        condition: service_started
    ports:
      - "${TECHDB_API_BIND:-127.0.0.1}:8000:8000"

  web:
    image: techdb-web:${TECHDB_IMAGE_TAG:-0801}
    build:
      context: .
      dockerfile: web/Dockerfile
    networks:
      - technet
    depends_on:
      - api
    ports:
      - "${TECHDB_WEB_PORT:-8080}:80"

  readonly-agent:
    image: techdb-readonly-agent:${TECHDB_IMAGE_TAG:-0801}
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - technet
    command: uvicorn app.readonly_agent:app --host 0.0.0.0 --port 8765
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-techdb}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-tech_intel}
      TECHDB_ENV: ${TECHDB_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      TECHDB_INITIAL_ADMIN_USERNAME: ${TECHDB_INITIAL_ADMIN_USERNAME:-admin}
      TECHDB_INITIAL_ADMIN_PASSWORD: ${TECHDB_INITIAL_ADMIN_PASSWORD:?TECHDB_INITIAL_ADMIN_PASSWORD must be set in .env}
      DATA_DIR: /app/data
      TECHDB_KB_PATH: /knowledge-base
      TECHDB_CHATBOT_PACKAGE_PATH: /chatbot-integration-package
      TECHDB_AGENT_API_KEY: ${TECHDB_AGENT_API_KEY}
      TECHDB_AGENT_BASE_URL: ${TECHDB_AGENT_BASE_URL:-https://aigate.catl.com/v1}
      TECHDB_AGENT_MODEL: ${TECHDB_AGENT_MODEL:-GLM-5.2}
      TECHDB_AGENT_ALLOWED_MODELS: ${TECHDB_AGENT_ALLOWED_MODELS:-}
      TECHDB_AGENT_AI_TIMEOUT_SECONDS: ${TECHDB_AGENT_AI_TIMEOUT_SECONDS:-180}
    volumes:
      - ${TECHDB_KB_PATH:-./external-data/knowledge-base}:/knowledge-base:ro
      - ${TECHDB_CHATBOT_PACKAGE_PATH:-./external-data/chatbot-package}:/chatbot-integration-package:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TECHDB_AGENT_BIND:-127.0.0.1}:${TECHDB_AGENT_PORT:-8766}:8765"

volumes:
  pg_data:
    external: true
    name: ${TECHDB_PG_VOLUME:-v260723_pg_data}
  qa_incremental_data:
    name: ${TECHDB_QA_INCREMENTAL_VOLUME:-techdb_qa_incremental_0801}


