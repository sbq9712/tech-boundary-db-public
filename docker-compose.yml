networks:
  technet:
    driver: bridge
    # WSL host eth0 MTU is 1410, but Docker default bridge is 1500.
    # Oversized TLS ClientHello packets get silently dropped at the WSL NAT,
    # causing SSL UNEXPECTED_EOF errors to external APIs (e.g. api.z.ai).
    # Match the network MTU to the host to fix this.
    driver_opts:
      com.docker.network.driver.mtu: ${TECHDB_DOCKER_MTU:-1410}

services:
  db:
    image: postgres:16
    networks:
      - technet
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tech_intel}
      POSTGRES_USER: ${POSTGRES_USER:-techdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - technet
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-techdb}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-tech_intel}
      TECHDB_ENV: ${TECHDB_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      TECHDB_INITIAL_ADMIN_USERNAME: ${TECHDB_INITIAL_ADMIN_USERNAME:-admin}
      TECHDB_INITIAL_ADMIN_PASSWORD: ${TECHDB_INITIAL_ADMIN_PASSWORD:?TECHDB_INITIAL_ADMIN_PASSWORD must be set in .env}
      DATA_DIR: /app/data
      HERMES_AGENT_MODE: ${HERMES_AGENT_MODE:-http}
      HERMES_AGENT_HTTP_URL: ${HERMES_AGENT_HTTP_URL:-http://readonly-agent:8765/query}
      HERMES_AGENT_CLI: ${HERMES_AGENT_CLI:-hermes}
      HERMES_AGENT_TIMEOUT_SECONDS: ${HERMES_AGENT_TIMEOUT_SECONDS:-120}
      HERMES_AGENT_TOOLSETS: ${HERMES_AGENT_TOOLSETS:-}
      TECHDB_AGENT_API_KEY: ${TECHDB_AGENT_API_KEY}
      TECHDB_AGENT_BASE_URL: ${TECHDB_AGENT_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      TECHDB_AGENT_MODEL: ${TECHDB_AGENT_MODEL:-glm-5.2}
      TECHDB_AGENT_ALLOWED_MODELS: ${TECHDB_AGENT_ALLOWED_MODELS:-glm-5.2,glm-5.1,glm-4.5-flash}
      TECHDB_AGENT_MAX_RETRIES: ${TECHDB_AGENT_MAX_RETRIES:-2}
      TECHDB_AGENT_RETRY_BASE_DELAY_SECONDS: ${TECHDB_AGENT_RETRY_BASE_DELAY_SECONDS:-2}
      TECHDB_AGENT_HISTORY_MAX_MESSAGES: ${TECHDB_AGENT_HISTORY_MAX_MESSAGES:-60}
      TECHDB_AGENT_HISTORY_MAX_CHARS: ${TECHDB_AGENT_HISTORY_MAX_CHARS:-60000}
      TECHDB_AGENT_RETRIEVAL_MAX_CHARS: ${TECHDB_AGENT_RETRIEVAL_MAX_CHARS:-12000}
      TECHDB_AGENT_MAX_OUTPUT_TOKENS: ${TECHDB_AGENT_MAX_OUTPUT_TOKENS:-1800}
      TECHDB_KB_PATH: /knowledge-base
      BREADTH_DATA_PATH: /app/breadth_data
    volumes:
      - ./backend/scripts:/app/scripts:ro
      - ${TECHDB_KB_PATH:-./external-data/knowledge-base}:/knowledge-base:ro
      - ${TECHDB_CHATBOT_PACKAGE_PATH:-./external-data/chatbot-package}:/chatbot-integration-package:ro
      - ${TECHDB_DELIVERY_VIEWS_PATH:-./external-data/delivery-views}:/app/delivery_views:ro
      - ./breadth/data:/app/breadth_data:ro
    depends_on:
      db:
        condition: service_healthy
      readonly-agent:
        condition: service_started
    ports:
      - "${TECHDB_API_BIND:-127.0.0.1}:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: nginx:1.27-alpine
    networks:
      - technet
    depends_on:
      - api
    ports:
      - "${TECHDB_WEB_PORT:-8080}:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  readonly-agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - technet
    command: uvicorn app.readonly_agent:app --host 0.0.0.0 --port 8765
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-techdb}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-tech_intel}
      TECHDB_ENV: ${TECHDB_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      TECHDB_INITIAL_ADMIN_USERNAME: ${TECHDB_INITIAL_ADMIN_USERNAME:-admin}
      TECHDB_INITIAL_ADMIN_PASSWORD: ${TECHDB_INITIAL_ADMIN_PASSWORD:?TECHDB_INITIAL_ADMIN_PASSWORD must be set in .env}
      DATA_DIR: /app/data
      TECHDB_KB_PATH: /knowledge-base
      TECHDB_CHATBOT_PACKAGE_PATH: /chatbot-integration-package
      TECHDB_AGENT_API_KEY: ${TECHDB_AGENT_API_KEY}
      TECHDB_AGENT_BASE_URL: ${TECHDB_AGENT_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      TECHDB_AGENT_MODEL: ${TECHDB_AGENT_MODEL:-glm-5.2}
      TECHDB_AGENT_ALLOWED_MODELS: ${TECHDB_AGENT_ALLOWED_MODELS:-glm-5.2,glm-5.1,glm-4.5-flash}
      TECHDB_AGENT_AI_TIMEOUT_SECONDS: ${TECHDB_AGENT_AI_TIMEOUT_SECONDS:-90}
    volumes:
      - ${TECHDB_KB_PATH:-./external-data/knowledge-base}:/knowledge-base:ro
      - ${TECHDB_CHATBOT_PACKAGE_PATH:-./external-data/chatbot-package}:/chatbot-integration-package:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TECHDB_AGENT_BIND:-127.0.0.1}:8765:8765"

volumes:
  pg_data:
    external: true
    name: ${TECHDB_PG_VOLUME:-v260723_pg_data}