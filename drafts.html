<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>草稿管理（样机）</title>
  <style>
    :root{
      --bg:#f7f8f8; --text:#1a1a1a; --muted:#6b6f76; --line:rgba(0,0,0,.06);
      --r:12px; --shadow:0 1px 2px rgba(16,24,40,.04),0 0 0 1px rgba(16,24,40,.02);
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; font-family:var(--sans); color:var(--text);
      background: #f8f9fc;
    }
    a{ color:#5e6ad2; text-decoration:none; }
    a:hover{ text-decoration:underline; }

    .topbar{
      position:sticky; top:0; z-index:20;
      backdrop-filter: blur(12px) saturate(1.2);
      background: rgba(255,255,255,.92);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      max-width:1400px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; gap:12px;
    }
    .brand{ font-weight:850; }
    .nav{ display:flex; gap:10px; flex-wrap:wrap; }
    .nav a{
      padding:8px 10px; border-radius:10px;
      background:#f1f5f9;
      border:1px solid #e2e8f0;
      color:var(--text); font-size:14px;
    }

    .container{ max-width:1200px; margin:0 auto; padding:16px; }
    .card{
      background: #ffffff;
      border:1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .hd{ padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .bd{ padding:12px 14px; }
    .muted{ color:var(--muted); }
    .small{ font-size:12px; }

    table{ width:100%; border-collapse:separate; border-spacing:0; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; background:#f8fafc; }
    th,td{ padding:10px; border-bottom:1px solid #e2e8f0; font-size:13px; vertical-align:top; }
    th{ background:#f1f5f9; font-weight:650; white-space:nowrap; }
    tr:last-child td{ border-bottom:none; }

    .btn{ cursor:pointer; padding:8px 10px; border-radius:10px; border:1px solid #d1d5db; background:#f1f5f9; color:var(--text); font-size:12px; }
    .btn:hover{ background:#e2e8f0; }
    .actions{ display:flex; gap:8px; flex-wrap:wrap; }

    .empty{ padding:30px; text-align:center; color:#9aa6c7; }
  </style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">前沿技术情报与预警平台（样机） <span class="muted small">/ 草稿管理</span></div>
    <div class="nav">
        <a href="index.html">核心门户</a>
        <a href="info_table.html">情报总表</a>
        <a href="industry_dashboards.html">行业仪表盘</a>
        <a href="industry_map.html">行业图景</a>
        <a href="sources.html">信息源</a>
        <a href="upload_review.html?v=20260326d">上传&复核</a>
        <a href="drafts.html">草稿管理</a>
        <a href="excel_import.html">批量导入</a>
        <button onclick="Auth.showChangePassword()" style="cursor:pointer;padding:8px 10px;border-radius:10px;background:#f1f5f9;border:1px solid #e2e8f0;color:#64748b;font-size:14px;">修改密码</button>
        <button onclick="Auth.logout()" style="cursor:pointer;padding:8px 10px;border-radius:10px;background:#f1f5f9;border:1px solid #e2e8f0;color:#64748b;font-size:14px;">退出</button>
      </div>
  </div>
</div>

<div class="container">
  <section class="card">
    <div class="hd">
      <div style="font-weight:750;">草稿列表</div>
      <a class="btn" href="upload_review.html?v=20260326d">新建草稿</a>
    </div>
    <div class="bd">
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>标题</th>
              <th>发布时间</th>
              <th>领域</th>
              <th>重要度</th>
              <th>comment</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="draftBody"></tbody>
        </table>
      </div>
      <div id="emptyBox" class="empty" style="display:none;">暂无草稿</div>
    </div>
  </section>
</div>

<script src="/auth.js"></script>
<script>
  Auth.requireAuth();
  const API_BASE = window.API_BASE || "/api";
  const $ = s => document.querySelector(s);

  async function loadApi(path, options = {}){
    const r = await Auth.authFetch(`${API_BASE}${path}`, {
      cache: "no-store",
      ...options
    });
    if(!r) return null;
    if(!r.ok){
      const text = await r.text();
      throw new Error(`API请求失败 (${r.status}) ${text}`);
    }
    if(r.status === 204) return null;
    return await r.json();
  }

  async function render(){
    const list = await loadApi("/info-items/drafts");
    const tbody = $("#draftBody");
    tbody.innerHTML = "";
    if(list.length === 0){
      $("#emptyBox").style.display = "block";
      return;
    }
    $("#emptyBox").style.display = "none";

    list.forEach(draft => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${draft.title || "-"}</td>
        <td>${(draft.published_at || "").slice(0, 10) || "-"}</td>
        <td>${(draft.domain_ids || []).join("、") || "-"}</td>
        <td>${draft.importance_score || "-"}</td>
        <td>${draft.comment ? "有" : "无"}</td>
        <td>
          <div class="actions">
            <button class="btn" data-continue>继续提交 AI</button>
            <button class="btn" data-delete>删除</button>
          </div>
        </td>
      `;

      tr.querySelector("[data-continue]").addEventListener("click", () => {
        location.href = `upload_review.html?v=20260326d&draft_id=${encodeURIComponent(draft.id)}`;
      });

      tr.querySelector("[data-delete]").addEventListener("click", async () => {
        try{
          await loadApi(`/info-items/${encodeURIComponent(draft.id)}`, { method: "DELETE" });
          await render();
        }catch(err){
          alert(err?.message || "删除失败");
        }
      });

      tbody.appendChild(tr);
    });
  }

  render().catch(err => {
    console.error(err);
    $("#emptyBox").style.display = "block";
    $("#emptyBox").textContent = "草稿加载失败，请检查后端服务";
  });
</script>
<script src="auth.js"></script>
<script src="portal_shell.js"></script>
</body>
</html>
