name: Document ingestion contracts
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'services/canonical-qa/**'
      - '.github/workflows/document-ingestion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techdb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d techdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/techdb_test
      TECHDB_UPLOAD_RECOVERY_ENABLED: 'false'
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: ${{ github.workspace }}/.document-models
      DOCLING_TEST_REPORT_DIR: ${{ github.workspace }}/reports/docling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Native document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgomp1 fonts-dejavu-core ffmpeg libreoffice-writer libreoffice-calc libreoffice-impress
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt reportlab==4.4.10 jieba==0.42.1 rank-bm25==0.2.2 ruff
          python -m pip check
      - name: Migration including document asset manifest
        working-directory: backend
        run: alembic upgrade head
      - name: Regression and deterministic contracts
        run: |
          python -m pytest -q backend/tests/test_document_ingestion.py backend/tests/test_upload_ingestion.py backend/tests/test_agent_service.py backend/tests/test_health.py backend/tests/test_classification.py backend/tests/test_model_catalog.py
          python -m compileall -q backend/app backend/alembic services/canonical-qa/qa-backend
          ruff check backend/app/document_ingestion backend/tests/test_document_ingestion.py backend/tests/test_document_conversion_real.py backend/alembic/versions/0021_document_assets.py
      - name: Six real document conversions and OCR
        env:
          RUN_DOCLING_REAL_TESTS: '1'
          TECHDB_DOCLING_FORMULAS: 'true'
        run: python -m pytest -q -s backend/tests/test_document_conversion_real.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-document-conversion-reports
          path: ${{ github.workspace }}/reports/docling
          if-no-files-found: ignore
