name: Feed package contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_feed_package.py"
      - "scripts/validate_feed_package.py"
      - "scripts/test_feed_package_contract.py"
      - "backend/app/services/github_import.py"
      - "backend/app/services/table_rows.py"
      - "backend/app/services/breadth_index_queue.py"
      - "backend/tests/test_feed_v2_import_and_queue.py"
      - "backend/tests/test_github_incremental_import.py"
      - ".github/workflows/feed-package-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techdb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d techdb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/techdb_test
      TECHDB_UPLOAD_RECOVERY_ENABLED: 'false'
      TECHDB_BREADTH_INDEX_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 不用 pip 缓存：torch 系 wheel 缓存 + 安装双份会撑爆 runner 磁盘
      - name: Dependencies
        env:
          PIP_NO_CACHE_DIR: '1'
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip check
      - name: Syntax
        run: |
          python -m py_compile scripts/build_feed_package.py scripts/validate_feed_package.py scripts/test_feed_package_contract.py scripts/sync_qa_index.py scripts/compare_qa_old_new.py
      - name: Migration to head (incl. 0027 feed v2 columns/queue)
        working-directory: backend
        run: alembic upgrade head
      # 真实全量包（68k 条）生成校验在部署机上执行（CI 无主存储副本）；
      # CI 侧覆盖：合成 v2 包端到端过独立校验器（生成器同构函数构造）
      - name: Synthetic v2 package passes standalone validator
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from test_feed_package_contract import _build_v2_zip, _rec
          import validate_feed_package as validator
          f = tempfile.NamedTemporaryFile(suffix=".zip", delete=False)
          f.write(_build_v2_zip([_rec(1), _rec(2, u="")]))
          f.close()
          rep = validator.validate(Path(f.name))
          print(rep.render())
          assert not rep.errors, rep.errors
          PY
      - name: Three-way contract tests (builder=validator=importer)
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/scripts
        run: python -m pytest -q scripts/test_feed_package_contract.py
      - name: Feed v2 import + queue regression
        run: |
          python -m pytest -q backend/tests/test_feed_v2_import_and_queue.py
          python -m pytest -q backend/tests/test_github_incremental_import.py
